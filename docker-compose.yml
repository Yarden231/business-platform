# Local development stack. Values come from `.env` (see `.env.example`).
#
# The API applies its migrations on start-up here; Azurite runs because Phase 6
# introduces the document store, and because a developer should not have to
# change their environment between phases.

name: cohen-balancing

services:
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 keeps its cluster under /var/lib/postgresql/<major>/docker,
      # so the whole directory is the volume mount point.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    restart: unless-stopped
    # Blob service only. Queues and tables are not part of the design.
    command: ['azurite-blob', '--blobHost', '0.0.0.0', '--blobPort', '10000', '--location', '/data']
    ports:
      - '${AZURITE_BLOB_PORT:-10000}:10000'
    volumes:
      - azurite-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').connect(10000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      # Inside the network the database is the `db` service on its own port.
      # DATABASE_URL in .env is the host's view of the same database and is
      # what tooling run outside Compose uses.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Development-only browser access straight to port 8000. The application
      # itself goes through the same-origin web proxy (ADR-0005).
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000}
    # Migrations run here because a single-container development stack has no
    # deployment pipeline to run them from, and a developer switching branches
    # should get a matching schema without a second command. Production does
    # not work this way: replicas must never race each other to migrate, so the
    # deployment runs `alembic upgrade head` once, before the new revision
    # starts (docs/architecture.md §3).
    #
    # The rest is the reloading development server; the image's own CMD has no
    # --reload.
    command:
      - sh
      - -c
      - |
        alembic upgrade head
        exec uvicorn app.main:app \
          --host 0.0.0.0 --port 8000 --reload \
          --log-level ${API_LOG_LEVEL:-info}
    ports:
      # Published for developer diagnostics only. The browser reaches the API
      # through the web origin (ADR-0005).
      - '${API_PORT:-8000}:8000'
    volumes:
      - ./apps/api:/srv/api
    depends_on:
      # The API migrates the database at start-up, so it waits for a database
      # that is accepting connections. Azurite is not touched until Phase 6;
      # the ordering is declared now so the stack always starts the same way.
      db:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      NEXT_TELEMETRY_DISABLED: '1'
    command: ['npm', 'run', 'dev', '--', '--hostname', '0.0.0.0', '--port', '3000']
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - ./apps/web:/srv/app/apps/web
      # Anonymous volumes keep the container's Linux dependencies and build
      # output from being shadowed by the host's.
      - /srv/app/node_modules
      - /srv/app/apps/web/node_modules
      - /srv/app/apps/web/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
  azurite-data:
