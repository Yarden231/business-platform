# Alembic configuration.
#
# The database URL is deliberately absent: `migrations/env.py` reads it from the
# application's settings, so migrations connect to exactly the database the
# application would (ADR-0020). Override it for a one-off target with:
#
#   uv run alembic -x db_url=postgresql+asyncpg://... upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Revisions are numbered and slugged — 0001_infrastructure_tables.py — so the
# order of the schema's history is readable from the directory listing.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# The [loggers] block Alembic's template puts here is absent on purpose:
# migrations/env.py installs the application's own logging pipeline, so a
# migration's output is structured like the rest of the system's.
