name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Integration tests run against real PostgreSQL, never SQLite (ADR-0022),
      # so CI provides the same major version the Compose stack does. The
      # credentials are the development placeholders published in .env.example,
      # which is what the job copies to .env below; the database is destroyed
      # with the runner.
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: cohen_balancing
          POSTGRES_USER: cohen
          POSTGRES_PASSWORD: local_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cohen -d cohen_balancing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up uv
        # The Python version comes from apps/api/.python-version, which uv
        # reads (and downloads) on its own.
        uses: astral-sh/setup-uv@v10
        with:
          version: '0.11.14'
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Create the environment file
        # The documented developer step, run verbatim. If .env.example stops
        # declaring everything the Compose stack needs, the Compose validation
        # inside ./scripts/check fails here.
        run: cp .env.example .env

      - name: Install dependencies
        run: ./scripts/install

      # The developer entry point, so a migration that only works from a
      # populated developer database fails here. Integration tests build their
      # own database from the same migrations.
      - name: Apply migrations
        run: ./scripts/migrate

      # One script covers Compose validation, ruff format, ruff lint, mypy,
      # import-linter, pytest (unit and PostgreSQL integration tests, including
      # the migration-drift check), prettier, eslint, tsc --noEmit, vitest and
      # the production Next.js build — the same command developers run locally.
      - name: Run quality gates
        run: ./scripts/check
